<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Buscar Productos</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar 
      placeholder="Buscar por nombre, tipo o descripción..." 
      (ionInput)="onSearch($event)"
      [debounce]="200">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    @for (item of itemsFiltrados(); track item.id) {
      <ion-item lines="full">
        <ion-thumbnail slot="start" (click)="irADetalle(item.id)">
          <img [src]="item.foto" [alt]="item.nombre" />
        </ion-thumbnail>
        <ion-label (click)="irADetalle(item.id)">
          <h2>{{ item.nombre }}</h2>
          <p>{{ item.tipo }} - {{ item.depto }}</p>
          <p><strong>{{ item.precio }}</strong></p>
        </ion-label>
        <ion-button 
          fill="clear" 
          slot="end" 
          (click)="toggleFav(item.id)">
          <ion-icon 
            [name]="esFav(item.id) ? 'heart' : 'heart-outline'" 
            [color]="esFav(item.id) ? 'danger' : 'medium'">
          </ion-icon>
        </ion-button>
      </ion-item>
    } @empty {
      <ion-text color="medium" class="ion-text-center">
        <p>No se encontraron resultados.</p>
      </ion-text>
    }
  </ion-list>
</ion-content>
<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">buscar</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>

<ion-card>
  <div style="position: relative;">
    <img [src]="item.foto" [alt]="item.nombre" />
    <ion-button 
      fill="clear" 
      size="small"
      style="position: absolute; top: 0; right: 0; --background: rgba(255,255,255,0.7); border-radius: 50%;"
      (click)="toggleFav($event)">
      <ion-icon 
        [name]="esFav() ? 'heart' : 'heart-outline'" 
        [color]="esFav() ? 'danger' : 'medium'">
      </ion-icon>
    </ion-button>
  </div>
  <ion-card-header>
    <ion-card-title>{{ item.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ dueno()?.depto }} - {{ dueno()?.nombre }}</ion-card-subtitle>
  </ion-card-header>
  
  <ion-card-content>
    <p>Garantía: {{ item.precio }}</p>
    <ion-button [routerLink]="['/detalle', item.id]">
      Ver más
    </ion-button>
  </ion-card-content>
</ion-card>
